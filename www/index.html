<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <section class="wrapper">
        <div class="cover-container">
            <img id="songCover" src="" alt="Cover">
            <h3 id="name"></h3>
            <h1 id="songName"></h1>
        </div>

        <div class="button-containers">
            <div>
                <button class="fa-solid fa-forward"></button>
                <button class="fa-solid fa-stop"></button>
                <button class="fa-solid fa-forward"></button>
            </div>
            <div>
                <div>
                    <label>00:00</label>
                    <label>00:00</label>
                </div>
                <input id="timestamp" type="range">   
            </div>
            <div>
                <button class="fa-solid fa-volume-off"></button>
                <input type="range">
                <button class="fa-solid fa-volume-high"></button>
            </div>
        </div>

    </section>
    <script src="index.js"></script>
</body>
</html>
