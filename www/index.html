<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <section class="wrapper">
        <div class="cover-container">
            <img id="cover-image" src="" alt="Cover">
            <h3 id="artist-name"></h3>
            <h1 id="song-name"></h1>
        </div>

        <div class="button-containers">
            <div>
                <button id="backward" class="fa-solid fa-forward"></button>
                <button id="stop" class="fa-solid fa-play"></button>
                <button id="forward" class="fa-solid fa-forward"></button>
            </div>
            <div>
                <div class="timestap">
                    <label id="current">00:00</label>
                    <label id="overall">00:00</label>
                </div>
                <input id="timestamp-range" type="range">   
            </div>
            <div>
                <input id="volume-range" type="range">
                <button id="volume-button" class="fa-solid fa-volume-high"></button>
            </div>
        </div>

    </section>
    <script src="index.js"></script>
</body>
</html>
